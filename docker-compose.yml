version: '3.8'

services:
  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
    networks:
      - langstar-network
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    ports:
      - "7827:7827"
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
    networks:
      - langstar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7827/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  langstar-network:
    driver: bridge

volumes:
  langstar-data: 