version: '3.8'

services:
  frontend:
    build:
      target: development
    ports:
      - "7828:7828"
    volumes:
      - ./ui:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev -- --host 0.0.0.0 --port 7828
    restart: "no"
    stdin_open: true
    tty: true

  backend:
    build:
      target: development
    ports:
      - "7827:7827"
    volumes:
      - ./server:/app
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=development
    command: uvicorn app:app --reload --host 0.0.0.0 --port 7827
    restart: "no"
    stdin_open: true
    tty: true 